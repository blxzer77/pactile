name: CI

on:
  push:
    branches: [main, beta, "release/**"]
  pull_request:
    branches: [main, beta]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Default fetch-depth is 1. Tests must not `git show` historical SHAs or
      # retired blobs — rewritten history and shallow clones will fail red.
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.32.1

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify strict Pactile brand surface
        run: node packages/cli/scripts/check-pactile-brand-surface.js --release

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Materialize dogfood for tests
        # Git Bash is available on both hosted runners. Keeping one materializer
        # means Linux and Windows execute the same test fixture.
        shell: bash
        run: |
          rm -rf .cursor/rules .cursor/agents .pactile/scripts
          mkdir -p .cursor/rules .cursor/agents .pactile/scripts
          cp packages/cli/src/templates/cursor/rules/* .cursor/rules/
          cp packages/cli/src/templates/cursor/agents/* .cursor/agents/
          cp -r packages/cli/src/templates/pactile/scripts/* .pactile/scripts/

      - name: Test
        env:
          # task.py archive/create/start-execution need `pactile kernel --json`.
          # A clean runner has no global CLI; point at this checkout's bin.
          PACTILE_KERNEL_CLI: node ${{ github.workspace }}/packages/cli/bin/pactile.js kernel --json
        run: pnpm test

      - name: Mirror-check
        run: pnpm mirror-check

      - name: Verify package file contract
        run: pnpm --filter @blxzer/pactile check:pack-files

      - name: Verify release tarball contents
        run: pnpm --filter @blxzer/pactile check:release-pack

      - name: Verify packed dependency and bins
        run: node packages/cli/scripts/release-preflight.js verify-packed-cli

  release-conformance:
    name: release conformance (${{ matrix.os }}, Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ["18.17.0", "lts/*", "current"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.32.1

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build release packages
        run: pnpm build

      - name: Verify four-package release and isolated installs
        run: node packages/cli/scripts/release-conformance.js

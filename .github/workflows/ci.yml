name: CI

on:
  push:
    branches: [main, develop, "feat/**", "fix/**", "chore/**"]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-policy:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v6
        with:
          version: 10.32.1
      - name: Install locked tooling without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify PR target and beta evidence for a release PR
        run: pnpm --filter @blxzer/pactile exec tsx scripts/release-pr-check.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Default fetch-depth is 1. Tests must not `git show` historical SHAs or
      # retired blobs — rewritten history and shallow clones will fail red.
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.32.1

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify strict Pactile brand surface
        run: pnpm --filter @blxzer/pactile exec tsx scripts/check-pactile-brand-surface.ts --release

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        if: runner.os != 'Windows'
        run: pnpm test

      # Hosted Windows runners can exceed the default 120s per case when
      # several init/update integration files run together. Bound concurrency
      # and allow those filesystem-heavy cases to finish before judging them.
      - name: Test (Windows)
        if: runner.os == 'Windows'
        run: pnpm --filter @blxzer/pactile exec vitest run --maxWorkers=2 --testTimeout=240000

      - name: Documentation smoke
        run: pnpm docs:smoke

      - name: Verify package file contract
        run: pnpm --filter @blxzer/pactile check:pack-files

      - name: Verify release tarball contents
        run: pnpm --filter @blxzer/pactile check:release-pack

      - name: Verify packed dependency and bins
        run: pnpm --filter @blxzer/pactile exec tsx scripts/release-preflight.ts verify-packed-cli

  release-conformance:
    name: release conformance (${{ matrix.os }}, Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ["20.0.0", "lts/*", "current"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.32.1

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the single release package
        run: pnpm build

      - name: Verify default lifecycle install with no Python on PATH and V2 Task smoke
        run: node packages/cli/.tmp/p31-script-build/release-conformance.js

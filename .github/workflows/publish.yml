# Branch pushes and PRs validate in CI. Only a tag publishes the one Pactile
# package: develop beta -> npm beta; main stable -> npm candidate. A separate
# confirmed dispatch promotes an already published stable version to latest.
name: Publish

on:
  push:
    tags:
      - "pactile-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Stable version to promote (for example 0.6.0)"
        required: true
        type: string
      confirmation:
        description: "Type PROMOTE to move candidate to latest"
        required: true
        type: string

permissions:
  contents: read

jobs:
  prepare:
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/pactile-v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      manifest_sha256: ${{ steps.prepare.outputs.manifest_sha256 }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 10.32.1
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify exact tag, package, and source branch
        run: pnpm --filter @blxzer/pactile exec tsx scripts/release-preflight.ts check-provenance --tag "${GITHUB_REF_NAME}" --remote origin
      - name: Ignore executable-bit normalization
        run: git config core.filemode false
      - name: Validate and seal the single tarball without publish credentials
        id: prepare
        run: >-
          pnpm --filter @blxzer/pactile exec tsx scripts/publish-packages.ts
          --prepare-only --artifact-dir "${RUNNER_TEMP}/release-artifacts"
          --receipt-output "${GITHUB_OUTPUT}"
          --tag "${GITHUB_REF_NAME}" --remote origin
      - name: Upload sealed release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pactile-release-${{ github.sha }}
          path: ${{ runner.temp }}/release-artifacts/
          if-no-files-found: error
          retention-days: 1
      - name: Stage compiled release tooling
        run: |
          mkdir -p "${RUNNER_TEMP}/release-tools"
          cp packages/cli/.tmp/p31-script-build/*.js "${RUNNER_TEMP}/release-tools/"
      - name: Upload compiled release tooling
        uses: actions/upload-artifact@v4
        with:
          name: pactile-release-tools-${{ github.sha }}
          path: ${{ runner.temp }}/release-tools/
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install npm with Trusted Publisher support
        run: npm install --global npm@11.6.2
      - name: Download sealed release artifacts
        uses: actions/download-artifact@v4
        with:
          name: pactile-release-${{ github.sha }}
          path: ${{ runner.temp }}/release-artifacts/
      - name: Download compiled release tooling
        uses: actions/download-artifact@v4
        with:
          name: pactile-release-tools-${{ github.sha }}
          path: packages/cli/scripts/
      - name: Publish the verified tarball
        run: >-
          node packages/cli/scripts/publish-packages.js
          --publish-only --artifact-dir "${RUNNER_TEMP}/release-artifacts"
          --expected-manifest-sha256 "${{ needs.prepare.outputs.manifest_sha256 }}"
          --tag "${GITHUB_REF_NAME}"
      - name: Verify npm dist-tag readback
        run: node packages/cli/scripts/release-preflight.js verify-npm --package cli

  promote:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.confirmation == 'PROMOTE' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Validate stable version input
        env:
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
      - uses: actions/checkout@v7
        with:
          ref: pactile-v${{ inputs.version }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
      - uses: pnpm/action-setup@v6
        with:
          version: 10.32.1
      - name: Install locked tooling without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build TypeScript promotion tooling
        run: pnpm --filter @blxzer/pactile run build:script-artifacts
      - name: Verify main ancestry and the exact package version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git merge-base --is-ancestor HEAD origin/main
          pnpm --filter @blxzer/pactile exec tsx scripts/release-preflight.ts check-versions \
            --require-tag --tag "pactile-v${VERSION}"
      - name: Verify candidate is the requested version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          actual="$(npm view @blxzer/pactile@candidate version --json)"
          [[ "$actual" == "\"$VERSION\"" || "$actual" == "$VERSION" ]] || exit 1
      - name: Promote the single package to latest
        env:
          VERSION: ${{ inputs.version }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm dist-tag add "@blxzer/pactile@$VERSION" latest
      - name: Verify latest and remove candidate
        env:
          VERSION: ${{ inputs.version }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          actual="$(npm view @blxzer/pactile@latest version --json)"
          [[ "$actual" == "\"$VERSION\"" || "$actual" == "$VERSION" ]] || exit 1
          candidate="$(npm view @blxzer/pactile@candidate version --json)"
          [[ "$candidate" == "\"$VERSION\"" || "$candidate" == "$VERSION" ]] || exit 1
          npm dist-tag rm @blxzer/pactile candidate
      - name: Verify npm tag readback without publish credentials
        env:
          VERSION: ${{ inputs.version }}
        run: node packages/cli/.tmp/p31-script-build/verify-promotion-readback.js
      - name: Prepare GitHub release notes
        env:
          VERSION: ${{ inputs.version }}
        run: node packages/cli/.tmp/p31-script-build/create-release-notes.js "${RUNNER_TEMP}/pactile-release-notes.md"
      - name: Create GitHub Latest Release last
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          notes_file="${RUNNER_TEMP}/pactile-release-notes.md"
          if gh release view "pactile-v${VERSION}" >/dev/null 2>&1; then
            gh release edit "pactile-v${VERSION}" \
              --title "$VERSION" --notes-file "$notes_file" --latest
          else
            gh release create "pactile-v${VERSION}" --verify-tag \
              --title "$VERSION" --notes-file "$notes_file" --latest
          fi

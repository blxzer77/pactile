# Pactile Configuration
# Project-level settings for the Pactile workflow system
#
# All values have sensible defaults. Only override what you need.

#-------------------------------------------------------------------------------
# Session Recording
#-------------------------------------------------------------------------------

# Commit message used when auto-committing journal/index changes
# after running add_session.py
session_commit_message: "chore: record journal"

# Maximum lines per journal file before rotating to a new one
max_journal_lines: 2000

#-------------------------------------------------------------------------------
# Session Auto-Commit
#-------------------------------------------------------------------------------

# Auto-commit behavior for session journal + task archive operations.
# - true (default): scripts auto-stage and auto-commit journal / task changes
#   after add_session.py / task.py archive runs.
# - false: scripts do not touch git. Files (journal-*.md, task archive moves)
#   are still written to disk; you decide whether to git add / commit.
#
# Use `false` if your project's .gitignore intentionally excludes `.pactile/`
# and you want session data kept local-only, or if you prefer to review
# staged changes manually before each commit.
#
# Accepts: true / false / yes / no / 1 / 0 / on / off (case-insensitive).
#
# session_auto_commit: true

#-------------------------------------------------------------------------------
# Context injection (opt-in)
#-------------------------------------------------------------------------------

# Optional get_context enrichment. Default off — JOURNAL FILE stays metadata-only.
#
# context_injection:
#   journal_snippet: false   # opt-in; inject ≤150 token recent journal summary in get_context

#-------------------------------------------------------------------------------
# Task Lifecycle Hooks
#-------------------------------------------------------------------------------

# Shell commands to run after task lifecycle events.
# Each hook receives TASK_JSON_PATH environment variable pointing to task.json.
# Hook failures print a warning but do not block the main operation.
#
# hooks:
#   after_create:
#     - "echo 'Task created'"
#   after_start:
#     - "echo 'Task started'"
#   after_finish:
#     - "echo 'Task finished'"
#   after_archive:
#     - "echo 'Task archived'"

#-------------------------------------------------------------------------------
# Monorepo / Packages
#-------------------------------------------------------------------------------

# Declare packages for monorepo projects.
# Pactile auto-detects workspaces during `pactile init`, but you can also
# configure them manually here.
#
# packages:
#   frontend:
#     path: packages/frontend
#   backend:
#     path: packages/backend
#   docs:
#     path: docs-site
#     type: submodule
#   # For polyrepo / meta-repo layouts (independent .git in each subdir),
#   # mark the package with `git: true`. The runtime treats it as an
#   # independent repository for things like git-context display.
#   webapp:
#     path: ./webapp
#     git: true

# Default package used when --package is not specified.
# default_package: frontend

#-------------------------------------------------------------------------------
# Human-reviewed artifact locale (zh | en)
#-------------------------------------------------------------------------------

# Language for prd/design/implement/verify/handoff and task create seeds.
# Does NOT translate CLI UI or existing archived tasks.
#
# artifact_locale: zh

#-------------------------------------------------------------------------------
# Smart Search CLI (optional per-machine override)
#-------------------------------------------------------------------------------
# run_smart_search.py resolves: env PACTILE_SMART_SEARCH_COMMAND, then this
# setting, then PATH, then node_modules/.bin and repo wrappers. No .runtime cache.
#
# smart_search:
#   command: smart-search

#-------------------------------------------------------------------------------
# Codex worker dispatch (documentation only — no Pactile-side switch)
#-------------------------------------------------------------------------------
# The planned `worker` binding uses independent Codex desktop tasks and
# cross-session messages. No bridge setting is active yet. Pactile does not
# dispatch Codex subagents. See .pactile/framework/codex-worker-dispatch.md.
